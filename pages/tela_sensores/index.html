<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="style.css">

    <script src="main.js" defer></script>
    <script src="../../assets/js/global.js" defer></script>

    <title>Track Flow || Sensores</title>
</head>

<body>
    <header>

        <nav class="navbar">
            <div class="navbar_bloco">
                <button class="btn_navbar_menu" id="btn_menu"><i class="fa-solid fa-bars"></i></button>

                <div class="logo">
                    <img src="../../assets/img/logo_sem_fundo.png" alt="logo">
                    <h6>Sensores</h6>
                </div>

                <a href="#" class="perfil"><img
                        src="https://i.pinimg.com/736x/23/40/8e/23408e565fc3f43454636fec27572d1f.jpg" alt=""></a>
            </div>

            <div class="menu_navbar">
                <ul>
                    <li><a href="../tela_dashboard/index.html">Dashboard</a></li>
                    <li><a href="../tela_relatorios/index.html">Relatórios</a></li>
                    <li><a href="../tela_sensores/index.html">Sensores</a></li>
                    <li><a href="../tela_trens/index.html">Trens</a></li>
                    <li><a href="../tela_usuarios/index.html">Usuários</a></li>
                </ul>
            </div>
        </nav>

    </header>
    <main>

        <div class="container">
            <div class="legendas">
                <h6>Sensores</h6>
                <h6>Leitura</h6>
                <h6>Status</h6>
            </div>

            <div class="dados">
                <div class="status card">
                    <p>Sensor <span>1</span></p>
                    <p>ID: <span>OK</span></p>
                </div>
                <div class="leitura card">
                    <p>Tipo: <span></span></p>
                    <p>Trem: <span></span></p>
                    <p>Leitura: <span></span></p>
                    <p>Localização: <span></span></p>
                </div>
                <div class="sensores card">
                    <p><span>OK</span></p>
                </div>
            </div>
        </div>

        <div class="inputs">
            <input type="text" placeholder="Insira o ID do sensor">
            <button>Enviar manutenção</button>
        </div>

    </main>
    <footer>
        <div class="marca_dagua">
            <small>Track Flow© 2026</small>
        </div>
    </footer>
</body>

</html>
